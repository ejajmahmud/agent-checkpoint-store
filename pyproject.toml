[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-checkpoint-store"
version = "0.1.0"
description = "Transactional memory and state checkpointing store with rollback and branching for agent workflows"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-checkpoint-store = "agent_checkpoint_store.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_checkpoint_store*"]
